<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTSOLARCO - Powering Tomorrow</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="static/logos/logo.jpg.jpeg">
    <style>
        :root {
            --bg: #05051a;
            --gold: #f0a840;
            --gold-bright: #ffc564;
            --white: #f4f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            z-index: 10;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .brand-block {
            text-align: center;
            margin-bottom: 3vh;
        }

        .company-name {
            font-size: clamp(2.2rem, 6vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--white);
            text-shadow: 0 0 60px rgba(240, 168, 64, 0.55), 0 0 120px rgba(240, 140, 30, 0.35);
            line-height: 1;
            animation: nameGlowPulse 3.5s ease-in-out infinite;
        }

        .company-name .accent {
            color: var(--gold-bright);
            text-shadow: 0 0 70px rgba(255, 180, 60, 0.8), 0 0 150px rgba(255, 150, 30, 0.5);
        }

        .tagline {
            font-size: clamp(0.8rem, 2vw, 1.25rem);
            font-weight: 300;
            letter-spacing: 0.28em;
            color: rgba(220, 210, 190, 0.85);
            margin-top: 0.4rem;
            text-transform: uppercase;
        }

        @keyframes nameGlowPulse {
            0%, 100% { text-shadow: 0 0 60px rgba(240, 168, 64, 0.55), 0 0 120px rgba(240, 140, 30, 0.35); }
            50% { text-shadow: 0 0 80px rgba(255, 185, 70, 0.75), 0 0 160px rgba(255, 155, 40, 0.55); }
        }

        .loading-block {
            position: absolute;
            bottom: 10vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .loading-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            color: rgba(200, 185, 155, 0.8);
            text-transform: uppercase;
        }

        .progress-track {
            width: clamp(200px, 40vw, 380px);
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.4);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e89820, #f5c45a, #ffda7a);
            border-radius: 10px;
            box-shadow: 0 0 14px rgba(245, 170, 50, 0.7);
            transition: width 0.1s linear;
        }

        .progress-percent {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(230, 210, 175, 0.9);
            text-shadow: 0 0 10px rgba(200, 150, 80, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="three-canvas"></canvas>

    <div class="overlay">
        <div class="brand-block">
            <h1 class="company-name">VERT<span class="accent">SOLAR</span>CO</h1>
            <p class="tagline">Powering Tomorrow</p>
        </div>
        <div class="loading-block" id="loadingBlock">
            <span class="loading-label">Loading</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // DOM elements
        const canvas = document.getElementById('three-canvas');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');

        // Quick Three.js setup - minimal configuration
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            antialias: false, // Faster
            alpha: false,
            powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Lower for speed
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#05051a');

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.z = 8;

        // Simple sun - just a glowing sphere
        const sunGeometry = new THREE.SphereGeometry(1.5, 32, 32); // Lower poly count
        const sunMaterial = new THREE.MeshBasicMaterial({ color: '#ffaa00' });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Simple glow using a larger transparent sphere
        const glowGeometry = new THREE.SphereGeometry(2.2, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({ 
            color: '#ff8800',
            transparent: true,
            opacity: 0.15,
            depthWrite: false
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glow);

        // Outer glow
        const outerGlowGeometry = new THREE.SphereGeometry(3, 32, 32);
        const outerGlowMaterial = new THREE.MeshBasicMaterial({ 
            color: '#ff6600',
            transparent: true,
            opacity: 0.05,
            depthWrite: false
        });
        const outerGlow = new THREE.Mesh(outerGlowGeometry, outerGlowMaterial);
        scene.add(outerGlow);

        // A few particles for ambiance
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 200;
        const positions = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 15;
            positions[i + 1] = (Math.random() - 0.5) * 10;
            positions[i + 2] = (Math.random() - 0.5) * 8;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            color: '#ffcc88',
            size: 0.03,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.6
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Simple animation
        let startTime = Date.now();
        const LOAD_DURATION = 3000; // 3 seconds loading

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / LOAD_DURATION, 1);
            
            // Update loading bar
            const percent = Math.round(progress * 100);
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';

            // Gentle sun pulse
            const pulse = 1 + Math.sin(elapsed * 0.003) * 0.05;
            sun.scale.setScalar(pulse);
            glow.scale.setScalar(pulse * 1.1);
            outerGlow.scale.setScalar(pulse * 1.2);

            // Rotate sun slowly
            sun.rotation.y += 0.005;
            
            // Move particles
            particles.rotation.y += 0.001;
            particles.rotation.x += 0.0005;

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start immediately
        animate();

        console.log('☀️ VERTSOLARCO - Fast Loading Ready');
    </script>

    <script>
        // Quick redirect after scene loads - total time < 4 seconds
        setTimeout(function() {
            document.body.style.transition = 'opacity 0.4s ease';
            document.body.style.opacity = '0';
            
            setTimeout(function() {
                window.location.href = 'home(en).html';
            }, 400);
        }, 3500); // Redirect at 3.5 seconds (with 0.4s fade = 3.9s total)
    </script>
</body>
</html>
